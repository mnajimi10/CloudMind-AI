
services:
  postgres:
    image: postgres:16
    container_name: cloudmind-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: cloudmind
      POSTGRES_USER: cloudmind_user
      POSTGRES_PASSWORD: cloudmind_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudmind_user -d cloudmind"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
